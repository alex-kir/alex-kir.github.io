<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tribulation of Myriad Races</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: "Inter", "Open Sans", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    p,
    span {
      font-family: "Inter", "Open Sans", sans-serif;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 10px 16px;
      flex-shrink: 0;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      z-index: 500;
    }

    .nav button {
      padding: 8px 20px;
      background: #333;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .nav button:hover:not(:disabled) {
      background: #444;
    }

    .nav button:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .nav .page-num {
      font-size: 14px;
      min-width: 60px;
      text-align: center;
      color: #aaa;
    }

    #content {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 32px;
      max-width: 840px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }

    #content p {
      line-height: 1.7;
      margin: 0.8em 0;
      touch-action: manipulation;
    }

    /* Dictionary popup */
    #dict-popup {
      display: none;
      position: fixed;
      z-index: 1000;
      background: #2a2a2a;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 10px 14px;
      max-width: 300px;
      min-width: 180px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      font-family: "Inter", "Open Sans", sans-serif;
      font-size: 14px;
      text-align: center;
    }

    #dict-popup.visible { display: block; }

    #dict-word-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    #dict-word {
      font-weight: bold;
      color: #fff;
      flex: 1;
    }

    #dict-btn-left, #dict-btn-right {
      background: none;
      border: 1px solid #555;
      color: #aaa;
      border-radius: 4px;
      padding: 2px 7px;
      cursor: pointer;
      font-size: 13px;
      flex-shrink: 0;
      line-height: 1.4;
    }

    #dict-btn-left:hover, #dict-btn-right:hover { color: #fff; border-color: #888; }
    #dict-btn-left:disabled, #dict-btn-right:disabled { opacity: 0.2; cursor: default; }

    #dict-hits {
      font-size: 12px;
      color: #888;
      font-weight: normal;
      margin-left: 4px;
    }

    #dict-speak {
      background: none;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 2px 7px;
      cursor: pointer;
      font-size: 13px;
      flex-shrink: 0;
      line-height: 1.4;
    }

    #dict-speak:hover { border-color: #888; }
    #dict-speak.hidden { display: none; }

    /* Список слов главы */
    #words-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 800;
    }

    #words-backdrop.visible { display: block; }

    #words-panel {
      position: absolute;
      inset: 50px;
      background: #242424;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 20px;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
    }

    #words-panel h2 {
      margin: 0 0 14px;
      font-size: 16px;
      color: #fff;
    }

    #words-panel h2 small { color: #888; font-weight: normal; font-size: 13px; margin-left: 8px; }

    #words-close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
    }

    #words-close:hover { color: #fff; }

    #words-empty { color: #888; font-style: italic; }

    .word-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid #333;
      font-size: 14px;
    }

    .word-row .w { color: #fff; font-weight: 600; min-width: 30%; }
    .word-row .t { color: #b0e0b0; flex: 1; }
    .word-row .h { color: #888; font-size: 12px; white-space: nowrap; }
    .word-row.hard .w { color: #f0d0a0; }

    /* Подсветка известных слов (CSS Custom Highlight API) */
    ::highlight(tmr-known) {
      text-decoration: underline dotted #5a8a6a;
      text-underline-offset: 3px;
    }

    ::highlight(tmr-hard) {
      text-decoration: underline solid #d09a40;
      text-underline-offset: 3px;
      color: #f0d0a0;
    }

    #dict-translation {
      color: #b0e0b0;
      min-height: 18px;
      white-space: pre-line;
      text-align: left;
    }

    #dict-translation.loading { color: #888; font-style: italic; }
    #dict-translation.error   { color: #e08080; font-style: italic; }

    /* Settings overlay */
    #settings-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 800;
    }

    #settings-backdrop.visible {
      display: block;
    }

    #settings-panel {
      position: absolute;
      inset: 50px;
      background: #242424;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 20px;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
    }

    #settings-panel h2 {
      margin: 0 0 20px;
      font-size: 16px;
      color: #fff;
    }

    #settings-close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
    }

    #settings-close:hover {
      color: #fff;
    }

    .settings-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .settings-label {
      font-size: 14px;
      color: #ccc;
      flex: 1;
    }

    .settings-row button {
      padding: 6px 14px;
      background: #333;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    .settings-row button:hover {
      background: #444;
    }

    #font-size-val {
      font-size: 14px;
      color: #aaa;
      min-width: 36px;
      text-align: center;
    }

    .translator-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .translator-options label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #e0e0e0;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="nav" id="nav-top">
    <button id="prev-top" onclick="go(-1)">&#9664;</button>
    <span class="page-num" id="page-top"></span>
    <button id="next-top" onclick="go(+1)">&#9654;</button>
    <button onclick="openSettings()" title="Настройки">&#9881;</button>
    <button id="fs-btn" onclick="toggleFullscreen()" title="Полный экран">&#x26F6;</button>
  </div>

  <div id="words-backdrop" onclick="handleWordsBackdropClick(event)">
    <div id="words-panel">
      <h2>Слова главы<small id="words-count"></small></h2>
      <button id="words-close" onclick="closeChapterWords()">&#x2715;</button>
      <div id="words-list"></div>
    </div>
  </div>

  <div id="settings-backdrop" onclick="handleBackdropClick(event)">
    <div id="settings-panel">
      <h2>Настройки</h2>
      <button id="settings-close" onclick="closeSettings()">&#x2715;</button>

      <div class="settings-row">
        <span class="settings-label">Размер шрифта</span>
        <button onclick="changeFontSize(-2)">A&#x207B;</button>
        <span id="font-size-val"></span>
        <button onclick="changeFontSize(+2)">A&#x207A;</button>
      </div>

      <div class="settings-row">
        <span class="settings-label">Переводчик</span>
        <span class="translator-options">
          <label><input type="checkbox" value="google" onchange="changeTranslators()"> Google</label>
          <label><input type="checkbox" value="mymemory" onchange="changeTranslators()"> MyMemory</label>
        </span>
      </div>

      <div class="settings-row">
        <span class="settings-label">Слова из словаря в этой главе</span>
        <button onclick="closeSettings(); openChapterWords()">Показать</button>
      </div>

      <div class="settings-row">
        <span class="settings-label">Подсвечивать известные слова</span>
        <input type="checkbox" id="highlight-toggle" onchange="changeHighlight(this.checked)">
      </div>

      <div class="settings-row">
        <span class="settings-label">Словарь</span>
        <button onclick="exportDictionary()">Скачать JSON</button>
      </div>
    </div>
  </div>

  <div id="dict-popup">
    <div id="dict-word-row">
      <button id="dict-btn-left" onclick="expandSel(-1)">&#x25C1;|</button>
      <span id="dict-word"><span id="dict-word-text"></span><span id="dict-hits"></span></span>
      <button id="dict-speak" onclick="speakPhrase()" title="Произнести">&#x1F50A;</button>
      <button id="dict-btn-right" onclick="expandSel(+1)">|&#x25B7;</button>
    </div>
    <div id="dict-translation"></div>
  </div>

  <div id="content">Загрузка…</div>


  <script>
    // ── Dictionary ──────────────────────────────────────────────
    // Выбранные переводчики: массив из 'google' / 'mymemory', может быть пустым.
    // Пустой список = только кэш, запросов в сеть нет.
    const TRANSLATORS_KEY = 'tmr-translators';
    const LEGACY_TRANSLATOR_KEY = 'tmr-translator';  // старый формат: одна строка
    const ALL_TRANSLATORS = ['google', 'mymemory'];

    function loadTranslators() {
      try {
        const raw = localStorage.getItem(TRANSLATORS_KEY);
        if (raw !== null) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) return arr.filter(t => ALL_TRANSLATORS.includes(t));
        }
      } catch { }
      const legacy = localStorage.getItem(LEGACY_TRANSLATOR_KEY);
      return ALL_TRANSLATORS.includes(legacy) ? [legacy] : ['google'];
    }

    let translators = loadTranslators();

    function translatorCheckboxes() {
      return [...document.querySelectorAll('.translator-options input[type=checkbox]')];
    }

    function changeTranslators() {
      translators = translatorCheckboxes().filter(cb => cb.checked).map(cb => cb.value);
      localStorage.setItem(TRANSLATORS_KEY, JSON.stringify(translators));
    }

    function initTranslatorSelect() {
      translatorCheckboxes().forEach(cb => { cb.checked = translators.includes(cb.value); });
    }

    const DICT_PREFIX = 'tmr-dict-';

    function dictCacheKey(word) {
      return DICT_PREFIX + word.toLowerCase();
    }

    // Дата по умолчанию для переводов, сделанных до появления отметок времени
    const LEGACY_TS = '2026-10-26T00:00:00';

    // Ключи записи, которые не являются переводчиками (служебные поля)
    const DICT_META_KEYS = new Set(['hits', 'first', 'last']);
    const DICT_PROVIDERS = ['google', 'mymemory', 'unk'];

    function validTs(v) {
      return typeof v === 'string' && !isNaN(new Date(v)) ? v : null;
    }

    // Приводит запись к актуальному формату:
    //   { google: { text, ts }, mymemory: { text, ts }, unk: { text, ts },
    //     hits: N, first: ISO, last: ISO }
    //   ts    — когда получен перевод от этого переводчика
    //   first — когда слово впервые добавлено в словарь
    //   last  — когда слово последний раз смотрели (обновляется при каждом показе)
    //   hits  — сколько раз смотрели
    // Старые форматы: строка -> { unk: ... };  { google: "текст" } -> { google: { text, ts: LEGACY_TS } }
    // Если есть известный перевод (google/mymemory), неизвестный (unk) удаляется.
    function normalizeDictEntry(parsed) {
      const obj = typeof parsed === 'string' ? { unk: parsed } : (parsed || {});
      let changed = typeof parsed === 'string';
      const out = {};
      for (const [k, v] of Object.entries(obj)) {
        if (DICT_META_KEYS.has(k)) continue;
        if (!v) { changed = true; continue; }
        if (typeof v === 'string') { out[k] = { text: v, ts: LEGACY_TS }; changed = true; }
        else if (v.text) out[k] = { text: v.text, ts: validTs(v.ts) || LEGACY_TS };
        else changed = true;
      }
      if (out.unk && (out.google || out.mymemory)) { delete out.unk; changed = true; }

      const hits = Number(obj.hits);
      if (Number.isInteger(hits) && hits > 0) out.hits = hits;

      // first: явное значение, иначе самая ранняя дата перевода, иначе LEGACY_TS
      const providerTs = DICT_PROVIDERS.map(p => out[p]?.ts).filter(Boolean).sort();
      const first = validTs(obj.first) || providerTs[0] || LEGACY_TS;
      if (first !== obj.first) changed = true;
      out.first = first;

      // last: явное значение, иначе самая поздняя дата перевода, иначе first
      const last = validTs(obj.last) || providerTs[providerTs.length - 1] || first;
      if (last !== obj.last) changed = true;
      out.last = last < first ? first : last;

      return { entry: out, changed };
    }

    // Фиксирует обращение к слову: hits++ и last = сейчас. Возвращает обновлённую запись.
    function dictBumpHits(word) {
      const entry = dictFromCache(word);
      if (!entry) return null;
      entry.hits = (entry.hits || 0) + 1;
      entry.last = new Date().toISOString();
      localStorage.setItem(dictCacheKey(word), JSON.stringify(entry));
      knownIndex = null;
      return entry;
    }


    function dictFromCache(word) {
      try {
        const key = dictCacheKey(word);
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        const { entry, changed } = normalizeDictEntry(JSON.parse(raw));
        if (changed) localStorage.setItem(key, JSON.stringify(entry));
        return entry;
      } catch { return null; }
    }

    function dictToCache(word, provider, text) {
      const existing = dictFromCache(word) || {};
      existing[provider] = { text, ts: new Date().toISOString() };
      const { entry } = normalizeDictEntry(existing);
      localStorage.setItem(dictCacheKey(word), JSON.stringify(entry));
      knownIndex = null;
    }

    function formatTranslations(obj) {
      const labels = { google: 'G', mymemory: 'M', unk: 'U' };
      return Object.entries(obj)
        .filter(([, v]) => v?.text)
        .map(([k, v]) => `${labels[k] ?? k}: ${v.text}`)
        .join('\n');
    }

    // Экспорт всего словаря из localStorage в JSON-файл
    function exportDictionary() {
      const dict = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key.startsWith(DICT_PREFIX)) continue;
        const word = key.slice(DICT_PREFIX.length);
        const entry = dictFromCache(word);
        if (entry && Object.keys(entry).length) dict[word] = entry;
      }
      const payload = {
        exportedAt: new Date().toISOString(),
        count: Object.keys(dict).length,
        translations: dict,
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tmr-dictionary-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function decodeHtmlEntities(str) {
      const ta = document.createElement('textarea');
      ta.innerHTML = str;
      return ta.value;
    }

    async function fetchFromGoogle(word) {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=${encodeURIComponent(word)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('API error');
      const data = await res.json();
      // Response: [[["перевод","word",...]], ...]
      const raw = data?.[0]?.map(chunk => chunk?.[0]).filter(Boolean).join('');
      if (!raw) throw new Error('no translation');
      return decodeHtmlEntities(raw);
    }

    async function fetchFromMyMemory(word) {
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|ru`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('API error');
      const data = await res.json();
      const raw = data?.responseData?.translatedText;
      if (!raw) throw new Error('no translation');
      return decodeHtmlEntities(raw);
    }

    const FETCHERS = { google: fetchFromGoogle, mymemory: fetchFromMyMemory };

    // Запрашивает перевод у всех выбранных переводчиков, которых ещё нет в кэше.
    // Возвращает запись словаря (со всеми переводами, включая кэшированные от невыбранных).
    // Ошибка только если в итоге нет ни одного перевода.
    async function fetchTranslation(word) {
      const cached = dictFromCache(word) || {};
      const missing = translators.filter(t => !cached[t]?.text);

      const results = await Promise.allSettled(missing.map(t => FETCHERS[t](word)));
      results.forEach((r, i) => {
        if (r.status === 'fulfilled') dictToCache(word, missing[i], r.value);
      });

      const entry = dictFromCache(word);
      const hasAny = entry && DICT_PROVIDERS.some(p => entry[p]?.text);
      if (!hasAny) {
        throw new Error(translators.length ? 'no translation' : 'no translator selected');
      }
      return dictBumpHits(word);
    }

    // ── Произношение (Web Speech API) ───────────────────────────
    const speechOk = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

    function pickEnglishVoice() {
      const voices = speechSynthesis.getVoices();
      return voices.find(v => /^en[-_]US/i.test(v.lang))
          || voices.find(v => /^en/i.test(v.lang))
          || null;
    }

    function speakPhrase() {
      if (!speechOk) return;
      const phrase = selPhrase();
      if (!phrase) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(phrase);
      u.lang = 'en-US';
      u.rate = 0.9;
      const voice = pickEnglishVoice();
      if (voice) u.voice = voice;
      speechSynthesis.speak(u);
    }

    // ── Подсветка известных слов (CSS Custom Highlight API) ─────
    const HIGHLIGHT_KEY = 'tmr-highlight';
    const HARD_HITS = 3;   // с этого числа обращений слово считается «трудным»
    const highlightOk = typeof Highlight !== 'undefined' && typeof CSS !== 'undefined' && CSS.highlights;
    let highlightOn = localStorage.getItem(HIGHLIGHT_KEY) !== '0';
    let knownIndex = null;  // { single: Map<word, hits>, multi: [[phrase, hits], ...] }

    function changeHighlight(on) {
      highlightOn = !!on;
      localStorage.setItem(HIGHLIGHT_KEY, highlightOn ? '1' : '0');
      applyHighlights();
    }

    function initHighlightToggle() {
      const cb = document.getElementById('highlight-toggle');
      cb.checked = highlightOn;
      cb.disabled = !highlightOk;
      if (!highlightOk) cb.title = 'Браузер не поддерживает CSS Highlight API';
    }

    // Индекс словаря для поиска в тексте: { single: Map<word, info>, multi: [[phrase, info], ...] }
    // info = { hits }
    function buildKnownIndex() {
      const single = new Map(), multi = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key.startsWith(DICT_PREFIX)) continue;
        const phrase = key.slice(DICT_PREFIX.length);
        let info = { hits: 0 };
        try {
          const e = JSON.parse(localStorage.getItem(key));
          info = { hits: Number(e?.hits) || 0 };
        } catch { }
        if (phrase.includes(' ')) multi.push([phrase, info]);
        else single.set(phrase, info);
      }
      return { single, multi };
    }

    // Обходит текст главы и вызывает onMatch(node, start, end, phrase, info)
    // для каждого вхождения слова или фразы из словаря.
    function scanChapterText(onMatch) {
      if (!knownIndex) knownIndex = buildKnownIndex();
      const { single, multi } = knownIndex;
      if (!single.size && !multi.length) return;

      const walker = document.createTreeWalker(document.getElementById('content'), NodeFilter.SHOW_TEXT);
      const wordRe = /[a-zA-Z][a-zA-Z'-]*/g;
      let node;
      while ((node = walker.nextNode())) {
        const text = node.textContent;
        if (!/[a-zA-Z]/.test(text)) continue;
        const lower = text.toLowerCase();

        // Одиночные слова
        let m;
        wordRe.lastIndex = 0;
        while ((m = wordRe.exec(text))) {
          const w = m[0].replace(/^['-]+|['-]+$/g, '').toLowerCase();
          const info = single.get(w);
          if (info) onMatch(node, m.index, m.index + m[0].length, w, info);
        }

        // Фразы из нескольких слов
        for (const [phrase, info] of multi) {
          let idx = lower.indexOf(phrase);
          while (idx !== -1) {
            const before = lower[idx - 1], after = lower[idx + phrase.length];
            const boundaryOk = !(before && /[a-z]/.test(before)) && !(after && /[a-z]/.test(after));
            if (boundaryOk) onMatch(node, idx, idx + phrase.length, phrase, info);
            idx = lower.indexOf(phrase, idx + phrase.length);
          }
        }
      }
    }

    function applyHighlights() {
      if (!highlightOk) return;
      CSS.highlights.delete('tmr-known');
      CSS.highlights.delete('tmr-hard');
      if (!highlightOn) return;

      const known = new Highlight(), hard = new Highlight();
      scanChapterText((node, start, end, phrase, info) => {
        const r = new Range();
        r.setStart(node, start);
        r.setEnd(node, end);
        (info.hits >= HARD_HITS ? hard : known).add(r);
      });
      CSS.highlights.set('tmr-known', known);
      CSS.highlights.set('tmr-hard', hard);
    }

    // ── Список слов главы ───────────────────────────────────────
    function formatShortDate(ts) {
      const d = new Date(ts);
      if (isNaN(d)) return '';
      return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function openChapterWords() {
      // Собираем слова в порядке первого появления в главе
      const seen = new Map();  // phrase -> count in chapter
      scanChapterText((node, start, end, phrase) => {
        seen.set(phrase, (seen.get(phrase) || 0) + 1);
      });

      const list = document.getElementById('words-list');
      document.getElementById('words-count').textContent = `${currentN} · ${seen.size}`;
      list.innerHTML = '';

      if (!seen.size) {
        list.innerHTML = '<div id="words-empty">В этой главе нет слов из словаря.</div>';
      }

      for (const [phrase, count] of seen) {
        const entry = dictFromCache(phrase);
        if (!entry) continue;
        const prov = DICT_PROVIDERS.find(p => entry[p]?.text);
        const row = document.createElement('div');
        row.className = 'word-row' + ((entry.hits || 0) >= HARD_HITS ? ' hard' : '');

        const w = document.createElement('span');
        w.className = 'w';
        w.textContent = phrase;

        const t = document.createElement('span');
        t.className = 't';
        t.textContent = prov ? entry[prov].text : '';

        const h = document.createElement('span');
        h.className = 'h';
        const parts = [];
        if (count > 1) parts.push(`в главе ×${count}`);
        if (entry.hits) parts.push(`смотрел ×${entry.hits}`);
        parts.push(`${formatShortDate(entry.first)} → ${formatShortDate(entry.last)}`);
        h.textContent = parts.join(' · ');

        row.append(w, t, h);
        list.appendChild(row);
      }

      document.getElementById('words-backdrop').classList.add('visible');
    }

    function closeChapterWords() {
      document.getElementById('words-backdrop').classList.remove('visible');
    }

    function handleWordsBackdropClick(e) {
      if (e.target === document.getElementById('words-backdrop')) closeChapterWords();
    }

    // Как и панель настроек: касания внутри списка не должны доходить до читалки
    {
      const wb = document.getElementById('words-backdrop');
      ['touchstart', 'touchend', 'touchmove', 'click'].forEach(evt => {
        wb.addEventListener(evt, e => e.stopPropagation(), { capture: false });
      });
    }
    // ── End Список слов главы ───────────────────────────────────

    // Контекст текущего выделения
    let ctx = null;  // { text, selStart, selEnd, sentStart, sentEnd, tapX, tapY }

    function getContextAtPoint(x, y) {
      let node, offset;
      if (document.caretRangeFromPoint) {
        const r = document.caretRangeFromPoint(x, y);
        if (!r) return null;
        node = r.startContainer; offset = r.startOffset;
      } else if (document.caretPositionFromPoint) {
        const p = document.caretPositionFromPoint(x, y);
        if (!p) return null;
        node = p.offsetNode; offset = p.offset;
      } else return null;

      if (node.nodeType !== Node.TEXT_NODE) return null;
      const text = node.textContent;

      // Слово под пальцем
      let s = offset, e = offset;
      while (s > 0 && /[a-zA-Z''-]/.test(text[s - 1])) s--;
      while (e < text.length && /[a-zA-Z''-]/.test(text[e])) e++;
      const word = text.slice(s, e).replace(/^['-]+|['-]+$/g, '');
      if (word.length <= 1) return null;

      // Границы предложения (не переходим через . ! ?)
      const enders = /[.!?]/;
      let sentStart = s;
      while (sentStart > 0 && !enders.test(text[sentStart - 1])) sentStart--;
      let sentEnd = e;
      while (sentEnd < text.length && !enders.test(text[sentEnd])) sentEnd++;

      return { text, selStart: s, selEnd: e, sentStart, sentEnd, tapX: x, tapY: y };
    }

    function selPhrase() {
      return ctx ? ctx.text.slice(ctx.selStart, ctx.selEnd).trim() : '';
    }

    function expandSel(dir) {
      if (!ctx) return;
      const { text, sentStart, sentEnd } = ctx;
      if (dir < 0) {
        let s = ctx.selStart;
        while (s > sentStart && /\s/.test(text[s - 1])) s--;
        while (s > sentStart && /[^a-zA-Z]/.test(text[s - 1]) && !/\s/.test(text[s - 1])) s--;
        while (s > sentStart && /[a-zA-Z''-]/.test(text[s - 1])) s--;
        if (s === ctx.selStart) return;
        ctx.selStart = s;
      } else {
        let e = ctx.selEnd;
        while (e < sentEnd && /\s/.test(text[e])) e++;
        while (e < sentEnd && /[^a-zA-Z]/.test(text[e]) && !/\s/.test(text[e])) e++;
        while (e < sentEnd && /[a-zA-Z''-]/.test(text[e])) e++;
        if (e === ctx.selEnd) return;
        ctx.selEnd = e;
      }
      translateAndShow();
    }

    const popup    = document.getElementById('dict-popup');
    const popWord  = document.getElementById('dict-word-text');
    const popHits  = document.getElementById('dict-hits');
    const popTrans = document.getElementById('dict-translation');
    const btnLeft  = document.getElementById('dict-btn-left');
    const btnRight = document.getElementById('dict-btn-right');
    const btnSpeak = document.getElementById('dict-speak');
    if (!speechOk) btnSpeak.classList.add('hidden');

    function translateAndShow() {
      const phrase = selPhrase();
      popWord.textContent = phrase;
      popHits.textContent = '';
      popTrans.textContent = '…';
      popTrans.className = 'loading';
      // Кнопки: отключить если дошли до границы предложения
      btnLeft.disabled  = ctx.selStart <= ctx.sentStart;
      btnRight.disabled = ctx.selEnd   >= ctx.sentEnd;
      popup.classList.add('visible');

      fetchTranslation(phrase).then(obj => {
        // Попап мог переключиться на другую фразу, пока шёл запрос
        if (selPhrase() !== phrase) return;
        popTrans.textContent = formatTranslations(obj);
        popTrans.className = '';
        popHits.textContent = obj?.hits > 1 ? `×${obj.hits}` : '';
        applyHighlights();
      }).catch(err => {
        if (selPhrase() !== phrase) return;
        popTrans.textContent = err?.message === 'no translator selected'
          ? 'нет в словаре, переводчик не выбран'
          : 'ошибка перевода';
        popTrans.className = 'error';
      });
    }

    function showPopupAt(x, y) {
      const c = getContextAtPoint(x, y);
      if (!c) return false;
      ctx = c;
      placePopup(x, y);
      translateAndShow();
      return true;
    }

    function placePopup(x, y) {
      const W = window.innerWidth;
      const pw = popup.offsetWidth || 280, ph = popup.offsetHeight || 80;
      const gap = 12;
      let left = x - pw / 2;
      let top  = y - ph - gap;
      if (top < gap) top = y + gap;
      if (left < gap) left = gap;
      if (left + pw > W - gap) left = W - pw - gap;
      popup.style.left = left + 'px';
      popup.style.top  = top  + 'px';
    }

    function hidePopup() { popup.classList.remove('visible'); ctx = null; }

    // Touch: ignore scroll, only fire on tap (< 10px move)
    let touchStartX = 0, touchStartY = 0, touchStartTarget = null;
    document.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchStartTarget = e.target;
    }, { passive: true });

    document.addEventListener('touchend', e => {
      const t = e.changedTouches[0];
      const dx = Math.abs(t.clientX - touchStartX);
      const dy = Math.abs(t.clientY - touchStartY);
      if (dx > 10 || dy > 10) { hidePopup(); return; }  // was a scroll

      // игнорировать если касание началось вне контента (но не в самом попапе)
      if (popup.contains(touchStartTarget)) return;
      if (!document.getElementById('content').contains(touchStartTarget)) return;

      if (popup.classList.contains('visible')) { hidePopup(); return; }

      if (showPopupAt(t.clientX, t.clientY)) e.preventDefault();
    });

    // Desktop: click
    document.addEventListener('click', e => {
      if ('ontouchstart' in window) return;
      if (popup.contains(e.target)) return;  // клик внутри попапа — не трогаем
      if (popup.classList.contains('visible')) { hidePopup(); return; }
      showPopupAt(e.clientX, e.clientY);
    });
    // ── End Dictionary ──────────────────────────────────────────

    // ── Fullscreen ───────────────────────────────────────────────
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener('fullscreenchange', () => {
      document.getElementById('fs-btn').textContent =
        document.fullscreenElement ? '\u22BF' : '\u26F6';
    });
    // ── End Fullscreen ───────────────────────────────────────────

    // ── Settings panel ───────────────────────────────────────────
    function openSettings() {
      document.getElementById('settings-backdrop').classList.add('visible');
    }

    function closeSettings() {
      document.getElementById('settings-backdrop').classList.remove('visible');
    }

    function handleBackdropClick(e) {
      if (e.target === document.getElementById('settings-backdrop')) closeSettings();
    }

    // Поглощаем все touch-события на панели настроек — они не должны доходить до контента
    const backdrop = document.getElementById('settings-backdrop');
    ['touchstart', 'touchend', 'touchmove', 'click'].forEach(evt => {
      backdrop.addEventListener(evt, e => e.stopPropagation(), { capture: false });
    });
    // ── End Settings panel ───────────────────────────────────────

    // ── Font size ────────────────────────────────────────────────
    const FONT_KEY = 'tmr-fontsize';
    const FONT_MIN = 12, FONT_MAX = 28;

    let fontSize = parseInt(localStorage.getItem(FONT_KEY)) || 16;

    function applyFontSize() {
      const el = document.getElementById('content');
      el.style.fontSize = fontSize + 'px';
      el.style.setProperty('--reader-font-size', fontSize + 'px');
      document.getElementById('font-size-val').textContent = fontSize + 'px';
    }

    function changeFontSize(delta) {
      fontSize = Math.min(FONT_MAX, Math.max(FONT_MIN, fontSize + delta));
      localStorage.setItem(FONT_KEY, fontSize);
      applyFontSize();
    }

    applyFontSize();
    initTranslatorSelect();
    initHighlightToggle();
    // ── End Font size ────────────────────────────────────────────

    const STORAGE_KEY = 'tmr-progress';
    let currentN = 1;
    let scrollSaveTimer = null;

    function saveProgress(n, paraIndex) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ chapter: n, para: paraIndex }));
    }

    function loadProgress() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
    }

    // Parse hash: "#3-42" -> { chapter: 3, para: 42 }
    function parseHash() {
      const hash = window.location.hash.replace('#', '');
      const [chStr, paraStr] = hash.split('-');
      const chapter = parseInt(chStr, 10);
      const para = parseInt(paraStr, 10);
      return {
        chapter: (chapter > 0) ? chapter : null,
        para: (para >= 0) ? para : 0,
      };
    }

    function setHash(n, para, replace = false) {
      const newHash = '#' + n + (para > 0 ? '-' + para : '');
      if (replace) {
        history.replaceState(null, '', newHash);
      } else {
        history.pushState(null, '', newHash);
      }
    }

    // Find index of the paragraph closest to the top of the scroll container
    function currentParaIndex() {
      const container = document.getElementById('content');
      const top = container.getBoundingClientRect().top;
      const paras = container.querySelectorAll('p');
      for (let i = paras.length - 1; i >= 0; i--) {
        if (paras[i].getBoundingClientRect().top <= top + 8) return i;
      }
      return 0;
    }

    function scrollToPara(index) {
      const paras = document.querySelectorAll('#content p');
      if (paras[index]) paras[index].scrollIntoView({ block: 'start' });
    }

    function setNav(n, hasNext, para) {
      document.getElementById('prev-top').disabled = n <= 1;
      document.getElementById('next-top').disabled = !hasNext;
      const paraStr = (para > 0) ? ' · §' + para : '';
      document.getElementById('page-top').textContent = n + paraStr;
    }

    async function load(n, restorePara) {
      const el = document.getElementById('content');
      el.textContent = 'Загрузка…';
      setNav(n, false);

      try {
        const res = await fetch(`step2/tmr-chapter-${n}.html`);
        if (!res.ok) throw new Error('not found');
        const html = await res.text();
        el.innerHTML = html;
        applyHighlights();
      } catch {
        el.textContent = `Глава ${n} не найдена.`;
        setNav(n, false);
        return;
      }

      // probe next chapter
      let hasNext = false;
      try {
        const probe = await fetch(`step2/tmr-chapter-${n + 1}.html`, { method: 'HEAD' });
        hasNext = probe.ok;
      } catch { }

      setNav(n, hasNext, restorePara);

      if (restorePara > 0) {
        scrollToPara(restorePara);
      } else {
        document.getElementById('content').scrollTo(0, 0);
      }

      saveProgress(n, restorePara || 0);
    }

    function go(delta) {
      const n = currentN + delta;
      if (n < 1) return;
      currentN = n;
      setHash(n, 0);
      load(n, 0);
    }

    // Update hash and localStorage on scroll (throttled)
    document.getElementById('content').addEventListener('scroll', () => {
      clearTimeout(scrollSaveTimer);
      scrollSaveTimer = setTimeout(() => {
        const para = currentParaIndex();
        setHash(currentN, para, true);
        saveProgress(currentN, para);
        document.getElementById('page-top').textContent = currentN + (para > 0 ? ' · §' + para : '');
      }, 300);
    });

    window.addEventListener('popstate', () => {
      const { chapter, para } = parseHash();
      if (chapter && chapter !== currentN) {
        currentN = chapter;
        load(currentN, para);
      }
    });

    // Initial load
    const { chapter: hashChapter, para: hashPara } = parseHash();
    const progress = loadProgress();

    if (hashChapter) {
      currentN = hashChapter;
      load(currentN, hashPara);
    } else if (progress.chapter) {
      currentN = progress.chapter;
      setHash(currentN, progress.para || 0, true);
      load(currentN, progress.para || 0);
    } else {
      currentN = 1;
      load(currentN, 0);
    }
  </script>
