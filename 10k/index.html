<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tribulation of Myriad Races</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: "Inter", "Open Sans", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    p,
    span {
      font-family: "Inter", "Open Sans", sans-serif;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 10px 16px;
      flex-shrink: 0;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      z-index: 500;
    }

    .nav button {
      padding: 8px 20px;
      background: #333;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .nav button:hover:not(:disabled) {
      background: #444;
    }

    .nav button:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .nav .page-num {
      font-size: 14px;
      min-width: 60px;
      text-align: center;
      color: #aaa;
    }

    #content {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 32px;
      max-width: 840px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }

    #content p {
      line-height: 1.7;
      margin: 0.8em 0;
      touch-action: manipulation;
    }

    /* Dictionary popup */
    #dict-popup {
      display: none;
      position: fixed;
      z-index: 1000;
      background: #2a2a2a;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 10px 14px;
      max-width: 300px;
      min-width: 180px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      font-family: "Inter", "Open Sans", sans-serif;
      font-size: 14px;
      text-align: center;
    }

    #dict-popup.visible { display: block; }

    #dict-word-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    #dict-word {
      font-weight: bold;
      color: #fff;
      flex: 1;
    }

    #dict-btn-left, #dict-btn-right {
      background: none;
      border: 1px solid #555;
      color: #aaa;
      border-radius: 4px;
      padding: 2px 7px;
      cursor: pointer;
      font-size: 13px;
      flex-shrink: 0;
      line-height: 1.4;
    }

    #dict-btn-left:hover, #dict-btn-right:hover { color: #fff; border-color: #888; }
    #dict-btn-left:disabled, #dict-btn-right:disabled { opacity: 0.2; cursor: default; }

    #dict-translation {
      color: #b0e0b0;
      min-height: 18px;
      white-space: pre-line;
      text-align: left;
    }

    #dict-translation.loading { color: #888; font-style: italic; }
    #dict-translation.error   { color: #e08080; font-style: italic; }

    /* Settings overlay */
    #settings-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 800;
    }

    #settings-backdrop.visible {
      display: block;
    }

    #settings-panel {
      position: absolute;
      inset: 50px;
      background: #242424;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 20px;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
    }

    #settings-panel h2 {
      margin: 0 0 20px;
      font-size: 16px;
      color: #fff;
    }

    #settings-close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
    }

    #settings-close:hover {
      color: #fff;
    }

    .settings-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .settings-label {
      font-size: 14px;
      color: #ccc;
      flex: 1;
    }

    .settings-row button {
      padding: 6px 14px;
      background: #333;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    .settings-row button:hover {
      background: #444;
    }

    #font-size-val {
      font-size: 14px;
      color: #aaa;
      min-width: 36px;
      text-align: center;
    }

    #translator-select {
      background: #333;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="nav" id="nav-top">
    <button id="prev-top" onclick="go(-1)">&#9664;</button>
    <span class="page-num" id="page-top"></span>
    <button id="next-top" onclick="go(+1)">&#9654;</button>
    <button onclick="openSettings()" title="Настройки">&#9881;</button>
    <button id="fs-btn" onclick="toggleFullscreen()" title="Полный экран">&#x26F6;</button>
  </div>

  <div id="settings-backdrop" onclick="handleBackdropClick(event)">
    <div id="settings-panel">
      <h2>Настройки</h2>
      <button id="settings-close" onclick="closeSettings()">&#x2715;</button>

      <div class="settings-row">
        <span class="settings-label">Размер шрифта</span>
        <button onclick="changeFontSize(-2)">A&#x207B;</button>
        <span id="font-size-val"></span>
        <button onclick="changeFontSize(+2)">A&#x207A;</button>
      </div>

      <div class="settings-row">
        <span class="settings-label">Переводчик</span>
        <select id="translator-select" onchange="changeTranslator(this.value)">
          <option value="google">Google</option>
          <option value="mymemory">MyMemory</option>
        </select>
      </div>
    </div>
  </div>

  <div id="dict-popup">
    <div id="dict-word-row">
      <button id="dict-btn-left" onclick="expandSel(-1)">&#x25C1;|</button>
      <span id="dict-word"></span>
      <button id="dict-btn-right" onclick="expandSel(+1)">|&#x25B7;</button>
    </div>
    <div id="dict-translation"></div>
  </div>

  <div id="content">Загрузка…</div>


  <script>
    // ── Dictionary ──────────────────────────────────────────────
    const TRANSLATOR_KEY = 'tmr-translator';
    let translator = localStorage.getItem(TRANSLATOR_KEY) || 'google';

    function changeTranslator(val) {
      translator = val;
      localStorage.setItem(TRANSLATOR_KEY, val);
    }

    function initTranslatorSelect() {
      document.getElementById('translator-select').value = translator;
    }

    const DICT_PREFIX = 'tmr-dict-';

    function dictCacheKey(word) {
      return DICT_PREFIX + word.toLowerCase();
    }

    function dictFromCache(word) {
      try {
        const raw = localStorage.getItem(dictCacheKey(word));
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        // Migration: old format was a plain string
        if (typeof parsed === 'string') {
          const migrated = { unk: parsed };
          localStorage.setItem(dictCacheKey(word), JSON.stringify(migrated));
          return migrated;
        }
        return parsed;
      } catch { return null; }
    }

    function dictToCache(word, provider, text) {
      const existing = dictFromCache(word) || {};
      existing[provider] = text;
      localStorage.setItem(dictCacheKey(word), JSON.stringify(existing));
    }

    function formatTranslations(obj) {
      const labels = { google: 'G', mymemory: 'M', unk: 'U' };
      return Object.entries(obj)
        .filter(([, v]) => v)
        .map(([k, v]) => `${labels[k] ?? k}: ${v}`)
        .join('\n');
    }

    function decodeHtmlEntities(str) {
      const ta = document.createElement('textarea');
      ta.innerHTML = str;
      return ta.value;
    }

    async function fetchFromGoogle(word) {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=${encodeURIComponent(word)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('API error');
      const data = await res.json();
      // Response: [[["перевод","word",...]], ...]
      const raw = data?.[0]?.map(chunk => chunk?.[0]).filter(Boolean).join('');
      if (!raw) throw new Error('no translation');
      return decodeHtmlEntities(raw);
    }

    async function fetchFromMyMemory(word) {
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|ru`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('API error');
      const data = await res.json();
      const raw = data?.responseData?.translatedText;
      if (!raw) throw new Error('no translation');
      return decodeHtmlEntities(raw);
    }

    async function fetchTranslation(word) {
      const cached = dictFromCache(word);
      if (cached?.[translator]) return cached;

      const text = translator === 'mymemory'
        ? await fetchFromMyMemory(word)
        : await fetchFromGoogle(word);

      dictToCache(word, translator, text);
      return dictFromCache(word);
    }

    // Контекст текущего выделения
    let ctx = null;  // { text, selStart, selEnd, sentStart, sentEnd, tapX, tapY }

    function getContextAtPoint(x, y) {
      let node, offset;
      if (document.caretRangeFromPoint) {
        const r = document.caretRangeFromPoint(x, y);
        if (!r) return null;
        node = r.startContainer; offset = r.startOffset;
      } else if (document.caretPositionFromPoint) {
        const p = document.caretPositionFromPoint(x, y);
        if (!p) return null;
        node = p.offsetNode; offset = p.offset;
      } else return null;

      if (node.nodeType !== Node.TEXT_NODE) return null;
      const text = node.textContent;

      // Слово под пальцем
      let s = offset, e = offset;
      while (s > 0 && /[a-zA-Z''-]/.test(text[s - 1])) s--;
      while (e < text.length && /[a-zA-Z''-]/.test(text[e])) e++;
      const word = text.slice(s, e).replace(/^['-]+|['-]+$/g, '');
      if (word.length <= 1) return null;

      // Границы предложения (не переходим через . ! ?)
      const enders = /[.!?]/;
      let sentStart = s;
      while (sentStart > 0 && !enders.test(text[sentStart - 1])) sentStart--;
      let sentEnd = e;
      while (sentEnd < text.length && !enders.test(text[sentEnd])) sentEnd++;

      return { text, selStart: s, selEnd: e, sentStart, sentEnd, tapX: x, tapY: y };
    }

    function selPhrase() {
      return ctx ? ctx.text.slice(ctx.selStart, ctx.selEnd).trim() : '';
    }

    function expandSel(dir) {
      if (!ctx) return;
      const { text, sentStart, sentEnd } = ctx;
      if (dir < 0) {
        let s = ctx.selStart;
        while (s > sentStart && /\s/.test(text[s - 1])) s--;
        while (s > sentStart && /[^a-zA-Z]/.test(text[s - 1]) && !/\s/.test(text[s - 1])) s--;
        while (s > sentStart && /[a-zA-Z''-]/.test(text[s - 1])) s--;
        if (s === ctx.selStart) return;
        ctx.selStart = s;
      } else {
        let e = ctx.selEnd;
        while (e < sentEnd && /\s/.test(text[e])) e++;
        while (e < sentEnd && /[^a-zA-Z]/.test(text[e]) && !/\s/.test(text[e])) e++;
        while (e < sentEnd && /[a-zA-Z''-]/.test(text[e])) e++;
        if (e === ctx.selEnd) return;
        ctx.selEnd = e;
      }
      translateAndShow();
    }

    const popup    = document.getElementById('dict-popup');
    const popWord  = document.getElementById('dict-word');
    const popTrans = document.getElementById('dict-translation');
    const btnLeft  = document.getElementById('dict-btn-left');
    const btnRight = document.getElementById('dict-btn-right');

    function translateAndShow() {
      const phrase = selPhrase();
      popWord.textContent = phrase;
      popTrans.textContent = '…';
      popTrans.className = 'loading';
      // Кнопки: отключить если дошли до границы предложения
      btnLeft.disabled  = ctx.selStart <= ctx.sentStart;
      btnRight.disabled = ctx.selEnd   >= ctx.sentEnd;
      popup.classList.add('visible');

      fetchTranslation(phrase).then(obj => {
        popTrans.textContent = formatTranslations(obj);
        popTrans.className = '';
      }).catch(() => {
        popTrans.textContent = 'ошибка перевода';
        popTrans.className = 'error';
      });
    }

    function showPopupAt(x, y) {
      const c = getContextAtPoint(x, y);
      if (!c) return false;
      ctx = c;
      placePopup(x, y);
      translateAndShow();
      return true;
    }

    function placePopup(x, y) {
      const W = window.innerWidth;
      const pw = popup.offsetWidth || 280, ph = popup.offsetHeight || 80;
      const gap = 12;
      let left = x - pw / 2;
      let top  = y - ph - gap;
      if (top < gap) top = y + gap;
      if (left < gap) left = gap;
      if (left + pw > W - gap) left = W - pw - gap;
      popup.style.left = left + 'px';
      popup.style.top  = top  + 'px';
    }

    function hidePopup() { popup.classList.remove('visible'); ctx = null; }

    // Touch: ignore scroll, only fire on tap (< 10px move)
    let touchStartX = 0, touchStartY = 0, touchStartTarget = null;
    document.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchStartTarget = e.target;
    }, { passive: true });

    document.addEventListener('touchend', e => {
      const t = e.changedTouches[0];
      const dx = Math.abs(t.clientX - touchStartX);
      const dy = Math.abs(t.clientY - touchStartY);
      if (dx > 10 || dy > 10) { hidePopup(); return; }  // was a scroll

      // игнорировать если касание началось вне контента (но не в самом попапе)
      if (popup.contains(touchStartTarget)) return;
      if (!document.getElementById('content').contains(touchStartTarget)) return;

      if (popup.classList.contains('visible')) { hidePopup(); return; }

      if (showPopupAt(t.clientX, t.clientY)) e.preventDefault();
    });

    // Desktop: click
    document.addEventListener('click', e => {
      if ('ontouchstart' in window) return;
      if (popup.contains(e.target)) return;  // клик внутри попапа — не трогаем
      if (popup.classList.contains('visible')) { hidePopup(); return; }
      showPopupAt(e.clientX, e.clientY);
    });
    // ── End Dictionary ──────────────────────────────────────────

    // ── Fullscreen ───────────────────────────────────────────────
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener('fullscreenchange', () => {
      document.getElementById('fs-btn').textContent =
        document.fullscreenElement ? '\u22BF' : '\u26F6';
    });
    // ── End Fullscreen ───────────────────────────────────────────

    // ── Settings panel ───────────────────────────────────────────
    function openSettings() {
      document.getElementById('settings-backdrop').classList.add('visible');
    }

    function closeSettings() {
      document.getElementById('settings-backdrop').classList.remove('visible');
    }

    function handleBackdropClick(e) {
      if (e.target === document.getElementById('settings-backdrop')) closeSettings();
    }

    // Поглощаем все touch-события на панели настроек — они не должны доходить до контента
    const backdrop = document.getElementById('settings-backdrop');
    ['touchstart', 'touchend', 'touchmove', 'click'].forEach(evt => {
      backdrop.addEventListener(evt, e => e.stopPropagation(), { capture: false });
    });
    // ── End Settings panel ───────────────────────────────────────

    // ── Font size ────────────────────────────────────────────────
    const FONT_KEY = 'tmr-fontsize';
    const FONT_MIN = 12, FONT_MAX = 28;

    let fontSize = parseInt(localStorage.getItem(FONT_KEY)) || 16;

    function applyFontSize() {
      const el = document.getElementById('content');
      el.style.fontSize = fontSize + 'px';
      el.style.setProperty('--reader-font-size', fontSize + 'px');
      document.getElementById('font-size-val').textContent = fontSize + 'px';
    }

    function changeFontSize(delta) {
      fontSize = Math.min(FONT_MAX, Math.max(FONT_MIN, fontSize + delta));
      localStorage.setItem(FONT_KEY, fontSize);
      applyFontSize();
    }

    applyFontSize();
    initTranslatorSelect();
    // ── End Font size ────────────────────────────────────────────

    const STORAGE_KEY = 'tmr-progress';
    let currentN = 1;
    let scrollSaveTimer = null;

    function saveProgress(n, paraIndex) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ chapter: n, para: paraIndex }));
    }

    function loadProgress() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
    }

    // Parse hash: "#3-42" -> { chapter: 3, para: 42 }
    function parseHash() {
      const hash = window.location.hash.replace('#', '');
      const [chStr, paraStr] = hash.split('-');
      const chapter = parseInt(chStr, 10);
      const para = parseInt(paraStr, 10);
      return {
        chapter: (chapter > 0) ? chapter : null,
        para: (para >= 0) ? para : 0,
      };
    }

    function setHash(n, para, replace = false) {
      const newHash = '#' + n + (para > 0 ? '-' + para : '');
      if (replace) {
        history.replaceState(null, '', newHash);
      } else {
        history.pushState(null, '', newHash);
      }
    }

    // Find index of the paragraph closest to the top of the scroll container
    function currentParaIndex() {
      const container = document.getElementById('content');
      const top = container.getBoundingClientRect().top;
      const paras = container.querySelectorAll('p');
      for (let i = paras.length - 1; i >= 0; i--) {
        if (paras[i].getBoundingClientRect().top <= top + 8) return i;
      }
      return 0;
    }

    function scrollToPara(index) {
      const paras = document.querySelectorAll('#content p');
      if (paras[index]) paras[index].scrollIntoView({ block: 'start' });
    }

    function setNav(n, hasNext, para) {
      document.getElementById('prev-top').disabled = n <= 1;
      document.getElementById('next-top').disabled = !hasNext;
      const paraStr = (para > 0) ? ' · §' + para : '';
      document.getElementById('page-top').textContent = n + paraStr;
    }

    async function load(n, restorePara) {
      const el = document.getElementById('content');
      el.textContent = 'Загрузка…';
      setNav(n, false);

      try {
        const res = await fetch(`step2/tmr-chapter-${n}.html`);
        if (!res.ok) throw new Error('not found');
        const html = await res.text();
        el.innerHTML = html;
      } catch {
        el.textContent = `Глава ${n} не найдена.`;
        setNav(n, false);
        return;
      }

      // probe next chapter
      let hasNext = false;
      try {
        const probe = await fetch(`step2/tmr-chapter-${n + 1}.html`, { method: 'HEAD' });
        hasNext = probe.ok;
      } catch { }

      setNav(n, hasNext, restorePara);

      if (restorePara > 0) {
        scrollToPara(restorePara);
      } else {
        document.getElementById('content').scrollTo(0, 0);
      }

      saveProgress(n, restorePara || 0);
    }

    function go(delta) {
      const n = currentN + delta;
      if (n < 1) return;
      currentN = n;
      setHash(n, 0);
      load(n, 0);
    }

    // Update hash and localStorage on scroll (throttled)
    document.getElementById('content').addEventListener('scroll', () => {
      clearTimeout(scrollSaveTimer);
      scrollSaveTimer = setTimeout(() => {
        const para = currentParaIndex();
        setHash(currentN, para, true);
        saveProgress(currentN, para);
        document.getElementById('page-top').textContent = currentN + (para > 0 ? ' · §' + para : '');
      }, 300);
    });

    window.addEventListener('popstate', () => {
      const { chapter, para } = parseHash();
      if (chapter && chapter !== currentN) {
        currentN = chapter;
        load(currentN, para);
      }
    });

    // Initial load
    const { chapter: hashChapter, para: hashPara } = parseHash();
    const progress = loadProgress();

    if (hashChapter) {
      currentN = hashChapter;
      load(currentN, hashPara);
    } else if (progress.chapter) {
      currentN = progress.chapter;
      setHash(currentN, progress.para || 0, true);
      load(currentN, progress.para || 0);
    } else {
      currentN = 1;
      load(currentN, 0);
    }
  </script>
</body>

</html>
